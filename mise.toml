[settings]
lockfile = true
locked = true

[tools]
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:mvdan/sh" = "3.13.1"
"aqua:koalaman/shellcheck" = "0.11.0"

[tasks.build]
description = "バイナリビルド"
run = "go build -o hi ./cmd/hi"

[tasks.fmt]
description = "format"
run = "golangci-lint fmt"

[tasks.lint]
description = "lint"
run = "golangci-lint run"

[tasks.e2e]
description = "e2e"
run = "./scripts/e2e-test.sh"
